<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Dhivyaprakash N — Software Engineer</title>
  <desc id="desc">A midnight blue engineering dashboard with cyan and violet system paths, introducing Dhivyaprakash N and a focus on backend systems, product interfaces, and data applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#111a31"/>
      <stop offset="1" stop-color="#171329"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#63d9e8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#63d9e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#a98aff" stop-opacity=".17"/>
      <stop offset="1" stop-color="#a98aff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a8bad8" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="24" fill="url(#grid)"/>
  <circle cx="1010" cy="55" r="250" fill="url(#glowViolet)"/>
  <circle cx="800" cy="240" r="250" fill="url(#glowCyan)"/>
  <path d="M0 224H358l36-36h138M1200 76h-160l-44 44H872" fill="none" stroke="#72dbe7" stroke-opacity=".42" stroke-width="1.5"/>
  <path d="M914 280v-53l40-40h116M1108 0v49l-30 30" fill="none" stroke="#b19aff" stroke-opacity=".52" stroke-width="1.5"/>
  <g fill="#72dbe7">
    <circle cx="358" cy="224" r="3"/><circle cx="532" cy="188" r="3"/><circle cx="872" cy="120" r="3"/>
    <circle cx="910" cy="227" r="3"/><circle cx="1070" cy="187" r="3"/>
  </g>
  <g fill="#b19aff"><circle cx="948" cy="187" r="3"/><circle cx="1078" cy="79" r="3"/><circle cx="1108" cy="49" r="3"/></g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="78" y="70" fill="#72dbe7" font-size="13" font-weight="700" letter-spacing="3">SOFTWARE ENGINEER  /  SYSTEMS &amp; PRODUCT</text>
    <text x="74" y="151" fill="#f2f5ff" font-size="58" font-weight="700" letter-spacing="-1.5">Dhivyaprakash N</text>
    <text x="78" y="194" fill="#c4cee2" font-size="19">Reliable backends. Thoughtful interfaces. Useful software.</text>
    <text x="78" y="244" fill="#92a3c0" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="1.5">JAVA  ·  TYPESCRIPT  ·  PYTHON  ·  REAL-TIME SYSTEMS</text>
  </g>
  <g transform="translate(1015 139)" fill="none" stroke-width="1.5">
    <circle r="54" stroke="#a98aff" stroke-opacity=".42"/>
    <circle r="33" stroke="#72dbe7" stroke-opacity=".52"/>
    <circle r="9" fill="#72dbe7" fill-opacity=".9" stroke="#72dbe7"/>
    <path d="M-54 0h21M33 0h21M0-54v21M0 33v21" stroke="#91a3c4" stroke-opacity=".62"/>
